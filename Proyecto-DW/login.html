<!DOCTYPE html>
<html lang="es">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inria+Sans:ital,wght@0,300;0,400;0,700;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="variables.css">
    <link rel="stylesheet" href="reset-tipografia.css">
    <link rel="stylesheet" href="login.css">
    <meta charset="UTF-8">
    <title>Plataforma Ganadera Austral - Login</title>
</head>

<body>

    <div class="login-container">

        <img src="logo.png" alt="Logo GA" class="logo-ga">

        <h1>Inicio de sesión</h1>

        <form id="login-form">

            <label for="usuario">Usuario</label>
            <input type="text" id="usuario" name="usuario" required>

            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required>

            <button type="submit" class="btn-primario">Iniciar sesión</button>

        </form>

        <small>Si aún no te has creado una cuenta</small>
        <a href="registro.html" class="btn-secundario">Registrarse</a>
        <script src="login.js"></script>
        <a href="#">¿Olvidó su contraseña?</a>

    </div>

</body>

</html>
