<!DOCTYPE html>
<html lang="es">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inria+Sans:ital,wght@0,300;0,400;0,700;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="variables.css">
    <link rel="stylesheet" href="reset-tipografia.css">
    <link rel="stylesheet" href="login.css">
    <meta charset="UTF-8">
    <title>Plataforma Ganadera Austral - Crear estancia</title>
</head>

<body>

    <div class="login-container">

        <img src="logo.png" alt="Logo GA" class="logo-ga">

        <h1>Crear estancia</h1>

        <form id="crear-estancia-form">

            <label for="nombre-estancia">Nombre de la estancia</label>
            <input type="text" id="nombre-estancia" name="nombre-estancia" required>

            <label for="nombre">Tu nombre completo</label>
            <input type="text" id="nombre" name="nombre" required>

            <label for="usuario">Usuario</label>
            <input type="text" id="usuario" name="usuario" required>

            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required>

            <label for="password-confirm">Confirmar contraseña</label>
            <input type="password" id="password-confirm" name="password-confirm" required>

            <button type="submit" class="btn-primario">Crear estancia</button>

        </form>

        <a href="registro.html">Volver</a>

    </div>

</body>

<script src="crear-estancia.js"></script>

</html>
