<!DOCTYPE html>
<html lang="es">

<head>
    <link rel="stylesheet" href="variables.css">
    <link rel="stylesheet" href="reset-tipografia.css">
    <link rel="stylesheet" href="modulos.css">
    <meta charset="UTF-8">
    <title>Plataforma Ganadera Austral - Informes</title>
    <script src="auth-guard-admin.js"></script>
</head>

<body>

    <h1>
        <img src="logo.png" alt="Logo GA" class="logo-ga">
    </h1>

    <nav>
        <a href="veraneada.html">Veraneada</a> |
        <a href="yerra.html">Yerra</a> |
        <a href="inseminacion.html">Inseminación</a> |
        <a href="inspeccion.html">Inspección</a> |
        <a href="alerta.html">Alerta</a> |
        <a href="informes.html">Informes</a>
        <div class="nav-usuario" id="nav-usuario"></div>
    </nav>
    <script src="nav-usuario.js"></script>

    <h2>Informes</h2>

    <form id="informes-form">

        <label for="fecha-desde">Fecha desde</label><br>
        <input type="date" id="fecha-desde" name="fecha-desde"><br><br>

        <label for="fecha-hasta">Fecha hasta</label><br>
        <input type="date" id="fecha-hasta" name="fecha-hasta"><br><br>

        <label for="modulo">Módulo</label><br>
        <select id="modulo" name="modulo">
            <option value="todos">Todos</option>
            <option value="veraneada">Veraneada</option>
            <option value="yerra">Yerra</option>
            <option value="inseminacion">Inseminación</option>
            <option value="inspeccion">Inspección Hereford</option>
        </select><br><br>

        <button type="submit" class="btn-primario">Generar informe</button>

    </form>

    <br>

    <table id="resultados-tabla" border="1">
        <thead>
            <tr>
                <th>Fecha</th>
                <th>Puesto</th>
                <th>Módulo</th>
                <th>Detalle</th>
            </tr>
        </thead>
        <tbody>
            <!-- las filas se cargan acá con JS, una vez conectado al backend -->
        </tbody>
    </table>

    <br>

    <button id="btn-descargar-excel" class="btn-secundario">Descargar Excel</button>

</body>
<script src="informes.js"></script>

</html>
